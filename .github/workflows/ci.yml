name: SkillOpt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            default_config.yaml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml scikit-learn transformers torch

      - name: Cache HuggingFace model dir
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('default_config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Run smoke tests
        run: |
          python tests/smoke.py
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface

      - name: Run plugin health check
        run: |
          python execute.py

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.python-version }}
          path: |
            /tmp/smoke_*.txt
            logs/runs/
          if-no-files-found: ignore
